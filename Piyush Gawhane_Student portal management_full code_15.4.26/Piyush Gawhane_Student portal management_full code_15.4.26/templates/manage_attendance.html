{% extends "base.html" %}

{% block content %}
<style>
body {
    background-image: url("https://i.pinimg.com/1200x/ca/12/b0/ca12b0952089ce2d23f91a8636e34342.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh;
}

.card {
    background: rgba(255, 255, 255, 0.35); /* makes form readable */
    border-radius: 10px;
}
</style>
<div class="card">
    <div class="card-header">
        <h3 class="text-center">Mark Attendance</h3>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="attendance_date" class="form-label">Date</label>
                <input type="date" class="form-control" id="attendance_date" name="attendance_date" value="{{ today }}" required>
            </div>
            
            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Roll Number</th>
                            <th>Student Name</th>
                            <th>Attendance Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td>{{ student.roll_number }}</td>
                            <td>{{ student.name }}</td>
                            <td>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="attendance_{{ student.id }}" value="present" id="present_{{ student.id }}">
                                    <label class="form-check-label" for="present_{{ student.id }}">Present</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="attendance_{{ student.id }}" value="absent" id="absent_{{ student.id }}" checked>
                                    <label class="form-check-label" for="absent_{{ student.id }}">Absent</label>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Save Attendance</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mt-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
