{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Edit Exam Timetable Entry</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="course" class="form-label">Course *</label>
                            <select class="form-control" id="course" name="course" required>
                                <option value="Computer Science" {% if timetable.course == 'Computer Science' %}selected{% endif %}>Computer Science</option>
                                <option value="Information Technology" {% if timetable.course == 'Information Technology' %}selected{% endif %}>Information Technology</option>
                                <option value="Electronics" {% if timetable.course == 'Electronics' %}selected{% endif %}>Electronics</option>
                                <option value="Mechanical" {% if timetable.course == 'Mechanical' %}selected{% endif %}>Mechanical</option>
                                <option value="Civil" {% if timetable.course == 'Civil' %}selected{% endif %}>Civil</option>
                                <option value="Electrical" {% if timetable.course == 'Electrical' %}selected{% endif %}>Electrical</option>
                                <option value="Chemical" {% if timetable.course == 'Chemical' %}selected{% endif %}>Chemical</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="semester" class="form-label">Semester *</label>
                            <select class="form-control" id="semester" name="semester" required>
                                <option value="1" {% if timetable.semester == 1 %}selected{% endif %}>Semester 1</option>
                                <option value="2" {% if timetable.semester == 2 %}selected{% endif %}>Semester 2</option>
                                <option value="3" {% if timetable.semester == 3 %}selected{% endif %}>Semester 3</option>
                                <option value="4" {% if timetable.semester == 4 %}selected{% endif %}>Semester 4</option>
                                <option value="5" {% if timetable.semester == 5 %}selected{% endif %}>Semester 5</option>
                                <option value="6" {% if timetable.semester == 6 %}selected{% endif %}>Semester 6</option>
                                <option value="7" {% if timetable.semester == 7 %}selected{% endif %}>Semester 7</option>
                                <option value="8" {% if timetable.semester == 8 %}selected{% endif %}>Semester 8</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject Name *</label>
                        <input type="text" class="form-control" id="subject" name="subject" value="{{ timetable.subject }}" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="exam_date" class="form-label">Exam Date *</label>
                            <input type="date" class="form-control" id="exam_date" name="exam_date" value="{{ timetable.exam_date }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="exam_time" class="form-label">Exam Time *</label>
                            <input type="text" class="form-control" id="exam_time" name="exam_time" value="{{ timetable.exam_time }}" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="venue" class="form-label">Venue/Room *</label>
                        <input type="text" class="form-control" id="venue" name="venue" value="{{ timetable.venue }}" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Update Exam Entry</button>
                        <a href="{{ url_for('manage_timetables') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
