{% extends "base.html" %}

{% block content %}

<style>
    body {
        background: url("https://i.pinimg.com/1200x/ca/12/b0/ca12b0952089ce2d23f91a8636e34342.jpg") no-repeat center center fixed;
        background-size: cover;
    }

    .overlay {
        min-height: 100vh;
        background: rgba(0, 0, 0, 0.0);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .card {
        width: 100%;
        max-width: 700px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.0);
    }

    .card-header {
        border-top-left-radius: 15px;
        border-top-right-radius: 15px;
    }

    .form-control {
        border-radius: 8px;
    }

    .btn {
        border-radius: 8px;
    }
</style>

<div class="overlay">
    <div class="card">

        <!-- Header -->
        <div class="card-header bg-primary text-white text-center">
            <h3 class="mb-0">Enter Student Marks</h3>
        </div>

        <!-- Body -->
        <div class="card-body">

            <form method="POST">

                <!-- Student -->
                <div class="mb-3">
                    <label for="student_id" class="form-label">Select Student</label>
                    <select class="form-control" id="student_id" name="student_id" required>
                        <option value="">Select Student</option>
                        {% for student in students %}
                        <option value="{{ student.id }}">
                            {{ student.roll_number }} - {{ student.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Subject -->
                <div class="mb-3">
                    <label for="subject" class="form-label">Subject</label>
                    <input type="text" class="form-control" id="subject" name="subject" required>
                </div>

                <!-- Test Name -->
                <div class="mb-3">
                    <label for="test_name" class="form-label">Test/Assessment Name</label>
                    <input type="text" class="form-control" id="test_name" name="test_name"
                           placeholder="e.g., Mid-Term, Final Exam, Assignment 1" required>
                </div>

                <!-- Marks -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="marks_obtained" class="form-label">Marks Obtained</label>
                        <input type="number" class="form-control" id="marks_obtained" name="marks_obtained" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="total_marks" class="form-label">Total Marks</label>
                        <input type="number" class="form-control" id="total_marks" name="total_marks" required>
                    </div>
                </div>

                <!-- Date -->
                <div class="mb-3">
                    <label for="test_date" class="form-label">Test Date</label>
                    <input type="date" class="form-control" id="test_date" name="test_date" required>
                </div>

                <!-- Buttons -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Save Marks</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mt-2">Cancel</a>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}
